# On every push, run experiments/compare_mem_delays.py on a Kaggle GPU kernel and
# wait for it. Needs ONE repo secret (Settings -> Secrets and variables -> Actions):
#   KAGGLE_API_TOKEN = the "KGAT_..." token from https://www.kaggle.com/settings -> API
#
# Kill switch: set the repository variable KAGGLE_GPU to "false" and pushes stop
# triggering the Kaggle run (any other value, or unset, keeps it on).
#   gh variable set KAGGLE_GPU --body false   # disable
#   gh variable set KAGGLE_GPU --body true    # re-enable
# or Settings -> Secrets and variables -> Actions -> Variables.
name: kaggle-gpu

on: push

# One Kaggle run at a time; a newer push cancels an in-flight wait (the kernel
# already running on Kaggle finishes on its own).
concurrency:
  group: kaggle-gpu
  cancel-in-progress: true

jobs:
  run-on-kaggle:
    # Kill switch: skip the whole job when the repo variable KAGGLE_GPU is "false".
    if: vars.KAGGLE_GPU != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KERNEL: ziyadcs/snn-delays-gpu
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure Kaggle auth
        run: |
          token="$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::Set the KAGGLE_API_TOKEN repository secret to the 'KGAT_...'" \
                 "token from kaggle.com/settings -> API (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "token length ${#token}, prefix ${token%%_*}_ (expect KGAT_)"
          mkdir -p ~/.kaggle
          printf '%s' "$token" > ~/.kaggle/access_token   # some CLI builds read only the file
          chmod 600 ~/.kaggle/access_token
          # Re-export the cleaned value for every later step.
          echo "KAGGLE_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Kaggle auth
        run: |
          if ! kaggle kernels list --mine >/dev/null 2>err.txt; then
            echo "::error::Kaggle rejected the token. Regenerate it at kaggle.com/settings ->"
            echo "::error::API -> Create New Token, then paste the full 'KGAT_...' string"
            echo "::error::(no quotes, no trailing newline) into the KAGGLE_API_TOKEN secret."
            cat err.txt
            exit 1
          fi
          echo "Kaggle auth OK"

      - name: Pin the kernel to this commit
        run: sed -i "s|__COMMIT_SHA__|${GITHUB_SHA}|" kaggle/run.py

      - name: Push kernel and start the GPU run
        run: kaggle kernels push -p kaggle

      - name: Wait for the kernel to finish
        run: |
          sleep 40                       # let Kaggle enqueue the new version
          for i in $(seq 1 100); do
            sleep 40
            # Status comes back like KernelWorkerStatus.COMPLETE / .ERROR / .RUNNING.
            status="$(kaggle kernels status "$KERNEL" 2>/dev/null | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
            echo "[$i] $status"
            case "$status" in
              *complete*)        echo "kernel complete"; exit 0 ;;
              *error*|*cancel*)   echo "kernel failed"; FAILED=1; break ;;
            esac
          done
          kaggle kernels output "$KERNEL" -p kaggle-output || true
          echo "::group::kernel log"
          cat kaggle-output/*.log 2>/dev/null || echo "(no log retrieved)"
          echo "::endgroup::"
          [ -n "$FAILED" ] && { echo "::error::Kaggle kernel run failed - traceback in the log above"; exit 1; }
          echo "::error::timed out waiting for the kernel"; exit 1

      - name: Download kernel output
        if: always()
        run: kaggle kernels output "$KERNEL" -p kaggle-output || true

      - name: Show results
        if: always()
        run: |
          echo "::group::kernel log"; cat kaggle-output/*.log 2>/dev/null || true; echo "::endgroup::"
          cat kaggle-output/delay_comparison/comparison.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-output
          path: kaggle-output
          if-no-files-found: ignore
