# CPU-only checks: the package imports, and every figure and table of the paper
# rebuilds from the measurements this repository records.
name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Same versions pyproject.toml pins, from the CPU index, so installing the
          # package afterwards is already satisfied and pulls no CUDA wheel.
          pip install torch==2.5.1 torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Import the package
        run: python -c "import delrec; print(delrec.__file__)"
      - name: Rebuild every figure and table
        env:
          MPLBACKEND: Agg
        run: python experiments/make_figures/make_all.py --measurements-only
